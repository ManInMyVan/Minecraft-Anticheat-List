name: Archive

on:
  workflow_dispatch:
  deployment
  #release:
  #  types: [published]

concurrency:
  group: "archive"
  cancel-in-progress: false

jobs:
  archive:
    name: Archive
    runs-on: ubuntu-latest
    steps:
      - name: Archive on Wayback Machine
        uses: JamieMagee/wayback@v2
        with:
          url: https://maninmyvan.github.io/Minecraft-Anticheat-List/
          saveOutlinks: true